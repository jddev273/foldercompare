name: Windows Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify release version identity
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pyVersion = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $runtimeVersion = python -c "import foldercompare; print(foldercompare.__version__)"
          if ($tagVersion -ne $pyVersion -or $tagVersion -ne $runtimeVersion) {
            throw "Release version mismatch: tag=$tagVersion pyproject=$pyVersion runtime=$runtimeVersion"
          }
      - name: Build portable executable and notices
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3 pillow==12.3.0
          ./scripts/windows_prepare_notices.ps1
          pyinstaller --noconfirm --clean --windowed --onefile --name FolderCompare foldercompare/__main__.py
      - name: Windows core end-to-end test
        run: python scripts/windows_core_e2e.py
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "FolderCompare-$tag-windows-x64-portable.zip"
          Compress-Archive -Path @("dist/FolderCompare.exe", "LICENSE", "THIRD_PARTY_NOTICES.txt") -DestinationPath $archive
          $verifyDir = Join-Path $env:RUNNER_TEMP "foldercompare-portable-verify"
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $verifyDir
          foreach ($required in @("FolderCompare.exe", "LICENSE", "THIRD_PARTY_NOTICES.txt")) {
            if (-not (Test-Path (Join-Path $verifyDir $required))) { throw "Portable ZIP missing required file: $required" }
          }
          Write-Host "PORTABLE_NOTICE_ASSERTIONS_OK"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\foldercompare.iss
          Move-Item release\FolderCompare-setup.exe "FolderCompare-$tag-windows-x64-setup.exe"
      - name: Installed and portable Windows app test
        shell: pwsh
        run: ./scripts/windows_app_e2e.ps1 -PortableExe "dist\FolderCompare.exe" -InstallerExe "FolderCompare-${{ github.ref_name }}-windows-x64-setup.exe"
      - name: Real packaged Windows GUI proof
        run: python scripts/windows_visual_proof.py --exe "dist\FolderCompare.exe" --output "windows-foldercompare-working.png" --read-only-output "windows-foldercompare-read-only.png"
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash FolderCompare-*-windows-x64-portable.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
          Get-FileHash FolderCompare-*-windows-x64-setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Add-Content SHA256SUMS.txt
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $portable = (Get-ChildItem 'FolderCompare-*-windows-x64-portable.zip').FullName
          $installer = (Get-ChildItem 'FolderCompare-*-windows-x64-setup.exe').FullName
          $checksums = (Resolve-Path 'SHA256SUMS.txt').Path
          $expected = @(
            (Split-Path $portable -Leaf)
            (Split-Path $installer -Leaf)
            'SHA256SUMS.txt'
          ) | Sort-Object

          # Keep the release private until every expected asset is attached and
          # independently observed through the GitHub API.
          gh release create $tag --draft --generate-notes --title $tag
          gh release upload $tag $portable $installer $checksums --clobber

          $release = gh release view $tag --json assets,isDraft | ConvertFrom-Json
          $actual = @($release.assets | ForEach-Object { $_.name }) | Sort-Object
          $delta = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($release.isDraft -ne $true -or $actual.Count -ne 3 -or $delta.Count -ne 0) {
            throw "Release asset verification failed. expected=$($expected -join ',') actual=$($actual -join ',') draft=$($release.isDraft)"
          }
          Write-Host "RELEASE_ASSET_ASSERTIONS_OK assets=$($actual -join ',')"

          gh release edit $tag --draft=false --latest
          $published = gh release view $tag --json assets,isDraft,isPrerelease | ConvertFrom-Json
          if ($published.isDraft -ne $false -or $published.isPrerelease -ne $false -or @($published.assets).Count -ne 3) {
            throw "Published release verification failed"
          }
          Write-Host "RELEASE_PUBLISHED_OK tag=$tag assets=$(@($published.assets).Count)"
