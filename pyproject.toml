[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "foldercompare"
version = "0.1.6"
description = "A safety-first Windows folder verifier for checking whether a copy or backup matches its original content."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "FolderCompare contributors"}]
keywords = ["folder", "directory", "diff", "compare", "windows"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.gui-scripts]
foldercompare = "foldercompare.app:main"

[tool.setuptools.packages.find]
include = ["foldercompare*"]
